        private DataTable GetEDIData()
        {
            DataTable dtGetData = null;
            try
            {
                char[] seperator = { '\\' };


                string[] file = PublicComponents.PROPath.Split(seperator);


                string[] arrFilename = file[file.Count() - 1].Replace(".PRO", "").Split('_');

                string str_ProNumber;

                if (arrFilename.Count() == 0)
                    str_ProNumber = arrFilename[0];
                else
                    str_ProNumber = arrFilename[1];

                string queryString = "SELECT * from FRP001ED where FHPRO in (SELECT PCEPRO FROM DSP092 where PCPRO in ('" + str_ProNumber + "'))";

                dtGetData = GetDataTableByText(As400_ConnectionString, queryString);
            }
            catch (Exception)
            {
                return dtGetData;
            }
            return dtGetData;
        }

